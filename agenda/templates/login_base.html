<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Spa Deseo{% endblock %}</title>

    <style>
        body {
            background-color: #ff4d8d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            margin: 0;
        }

        .login-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .btn-login {
            width: 100%;
            padding: 10px;
            background-color: #ff4d8d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-login:hover {
            opacity: 0.9;
        }

        .separator {
            margin: 15px 0;
            color: #888;
        }

        .mensaje {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            background-color: #ffe0ea;
            color: #b30047;
            font-size: 14px;
        }

        a {
            text-decoration: none;
            color: #ff4d8d;
        }

    </style>
</head>

<body>

    <div class="login-container">

        {% if messages %}
        {% for message in messages %}
        <div class="mensaje">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}

    </div>

</body>

</html>
