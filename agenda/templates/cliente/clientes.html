{% extends 'base.html' %}
{% block cuerpo %}

<div class="card">

    <h1>Clientes</h1>

    <a href="{% url 'agenda:crear_cliente' %}" class="btn">Crear Cliente</a>
    <br><br>

    <table>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Acciones</th>

        </tr>
        {% for i in datos %}

        <tr>
            <td>{{ i.id }}</td>
            <td>{{ i.nombre }}</td>
            <td>{{ i.apellido }}</td>
            <td>
                <a href="{% url 'agenda:actualizar_cliente' i.id %}" class="btn">Editar</a>
                <a href="{% url 'agenda:eliminar_cliente' i.id %}" class="btn">Eliminar</a>
            </td>

        </tr>
    {% endfor %}
    </table>
</div>
{% endblock %}
