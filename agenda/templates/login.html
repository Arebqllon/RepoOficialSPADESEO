{% extends "login_base.html" %}

{% block content %}

<div class="card form-card">

    <h1>Iniciar sesión</h1>

    <form method="POST">
        {% csrf_token %}

        <div class="fila">
            <div class="col">

                <label>Email</label>
                <input 
                    type="email" 
                    name="user" 
                    placeholder="Correo electrónico"
                    required
                    maxlength="100"
                ><br><br>

                <label>Contraseña</label>
                <input 
                    type="password" 
                    name="password" 
                    placeholder="Contraseña"
                    required
                    minlength="8"
                    maxlength="20"
                ><br><br>

            </div>
        </div>

        <button type="submit" class="btn-login">Ingresar</button>
    </form>

    <p>
        ¿Aún no tienes cuenta?
        <a href="{% url 'agenda:register' %}">
            Regístrate aquí
        </a>
    </p>

</div>


{% endblock %}
